name: On-Demand Playlist Ingestion (Scout v2.0)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'Spotify Playlist URL or URI'
        required: true
        default: 'https://open.spotify.com/playlist/4AGyN4LWzSqQXK1laupEaI'

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run On-Demand Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scout.py --playlist "${{ github.event.inputs.playlist_url }}"
